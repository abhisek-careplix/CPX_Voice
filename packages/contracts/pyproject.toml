[project]
name = "careplix-contracts"
version = "0.1.0"
description = "CarePlix Voice data contracts (JSON Schema source of truth, ADR15)"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema>=4.23", "referencing>=0.35"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careplix_contracts"]
