[project]
name = "careplix-common"
version = "0.1.0"
description = "CarePlix Voice shared runtime utilities (PHI-safe logging, evidence, Gemini probe)"
requires-python = ">=3.12,<3.13"
dependencies = ["google-genai>=2.34", "google-auth>=2.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careplix_common"]
