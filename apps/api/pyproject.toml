[project]
name = "careplix-api"
version = "0.1.0"
description = "CarePlix Voice control-plane API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "careplix-contracts",
  "careplix-common",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "livekit-api>=1.2,<2",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careplix_api"]
