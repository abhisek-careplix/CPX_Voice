[project]
name = "careplix-worker"
version = "0.1.0"
description = "CarePlix Voice generic agent worker (LiveKit Agents + Gemini Live)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "careplix-contracts",
  "careplix-common",
  "livekit-agents[google]>=1.8,<1.9",
  "google-genai>=2.34",
  "google-auth>=2.36",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careplix_worker"]
