[project]
name = "careplix-browser"
version = "0.1.0"
description = "CarePlix browser runtime: isolated Chromium sessions driven by the API (supervised browser agent)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "playwright==1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careplix_browser"]
