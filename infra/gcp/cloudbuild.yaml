# Builds the API/Studio, worker and OpenEMR proxy images into Artifact Registry.
#   gcloud builds submit --project careplix-labs --config infra/gcp/cloudbuild.yaml \
#     --substitutions _TAG=<git-sha>
substitutions:
  _REGION: us-central1
  _REPO: careplix-voice
  _TAG: manual
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/api/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/worker/Dockerfile", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:${_TAG}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/openemr-proxy:${_TAG}", "infra/openemr/proxy"]
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/worker:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/openemr-proxy:${_TAG}
options:
  machineType: E2_HIGHCPU_8
timeout: 1800s
